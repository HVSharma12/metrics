---
- name: Install the NVIDIA and AMD GPU agents for PCP
  hosts: monitoring

  roles:
    - role: linux-system-roles.metrics
      vars:
        metrics_provider: pcp
        # drop amdgpu where pcp-pmda-amdgpu is not packaged
        metrics_optional_domains: [nvidia, amdgpu]
        metrics_optional_packages: [pcp-pmda-nvidia-gpu, pcp-pmda-amdgpu]
